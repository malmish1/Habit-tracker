<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eaf6ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="mobile-web-app-capable" content="yes">
  <title>Rytm – vanor och uppgifter</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg"><link rel="apple-touch-icon" href="icons/icon.svg"><link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient one"></div><div class="ambient two"></div>
  <header class="topbar wrap"><a class="brand" href="#today"><span>☁️</span>rytm</a><nav class="desktop-nav" aria-label="Huvudmeny"></nav><button class="date-pill" data-go-today><i></i><span id="todayLabel"></span></button></header>
  <main class="wrap">
    <section class="hero"><div><p class="eyebrow" id="viewEyebrow">DIN DAG</p><h1 id="viewTitle">En sak i taget.<br><span>Bygg din rytm.</span></h1><p id="viewSubtitle">Dagens vanor och uppgifter, samlade på ett ställe.</p></div><div class="hero-actions"><button class="btn secondary" data-add-task>＋ Uppgift</button><button class="btn primary" data-add-habit>＋ Ny vana</button></div></section>
    <div id="app" aria-live="polite"></div>
  </main>
  <nav class="mobile-nav" aria-label="Mobilmeny"></nav>
  <footer class="wrap"><b>RYTM</b><span>Byggt för de små vinsterna.</span><button class="link" id="installBtn" hidden>Installera appen</button></footer>

  <dialog id="habitDialog"><form id="habitForm"><header><div><p class="eyebrow">VANA</p><h2 id="habitDialogTitle">Ny vana</h2></div><button type="button" class="icon-btn" data-close aria-label="Stäng">×</button></header>
    <input type="hidden" name="id"><div class="form-grid"><label class="wide">Namn<input name="name" maxlength="60" required placeholder="T.ex. Läs 10 minuter"></label><label class="wide">Beskrivning (valfri)<textarea name="description" maxlength="180" placeholder="Varför är vanan viktig?"></textarea></label><label>Kategori<input name="category" maxlength="30" placeholder="Hälsa"></label><label>Startdatum<input name="startDate" type="date" required></label><fieldset class="wide"><legend>Färg och ikon</legend><div class="appearance-row"><div id="colorOptions" class="color-options"></div><select name="icon" aria-label="Ikon"><option>✓</option><option>💧</option><option>📚</option><option>🏃</option><option>🧘</option><option>🌿</option><option>⭐</option></select></div></fieldset><label>Schema<select name="scheduleType" id="scheduleType"><option value="daily">Varje dag</option><option value="weekdays">Vissa veckodagar</option><option value="timesPerWeek">X gånger per vecka</option></select></label><label id="timesWrap" hidden>Gånger per vecka<input name="timesPerWeek" type="number" min="1" max="7" value="3"></label><fieldset class="wide" id="weekdaysWrap" hidden><legend>Aktiva dagar</legend><div class="weekday-options" id="weekdayOptions"></div></fieldset><label>Numeriskt mål (valfritt)<input name="targetValue" type="number" min="0" step="any" placeholder="T.ex. 8000"></label><label>Enhet<input name="targetUnit" maxlength="20" placeholder="steg, sidor, liter"></label></div><p class="form-error" id="habitError"></p><menu><button type="button" class="btn secondary" data-close>Avbryt</button><button class="btn primary">Spara vana</button></menu></form></dialog>

  <dialog id="taskDialog"><form id="taskForm"><header><div><p class="eyebrow">ATT GÖRA</p><h2 id="taskDialogTitle">Ny uppgift</h2></div><button type="button" class="icon-btn" data-close aria-label="Stäng">×</button></header><input type="hidden" name="id"><div class="form-grid"><label class="wide">Uppgift<input name="title" maxlength="80" required placeholder="Vad behöver göras?"></label><label class="wide">Anteckning (valfri)<textarea name="description" maxlength="180"></textarea></label><label>Datum<input name="date" type="date" required></label><label>Kategori<input name="category" maxlength="30" placeholder="Privat"></label></div><p class="form-error" id="taskError"></p><menu><button type="button" class="btn secondary" data-close>Avbryt</button><button class="btn primary">Spara uppgift</button></menu></form></dialog>

  <dialog id="confirmDialog" class="confirm"><div><h2>Ta bort permanent?</h2><p id="confirmText">Historiken försvinner och går inte att återställa.</p><menu><button class="btn secondary" data-confirm="no">Avbryt</button><button class="btn danger" data-confirm="yes">Ta bort</button></menu></div></dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="storage.js"></script><script src="stats.js"></script><script src="app.js"></script>
</body></html>
